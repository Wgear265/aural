[project]
name = "aural"
version = "0.1.0"
description = "Turn a prompt into an adult erotic audio script."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xai-sdk",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aural = "aural.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
